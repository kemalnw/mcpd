name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify source
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make fmt-check
          make vet
          make test
          make release-test

      - name: Package release
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          ./scripts/package-release.sh
          cat dist/checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets
        env:
          COSIGN_YES: "true"
        run: |
          for file in dist/mcpd_*.tar.gz dist/install.sh dist/checksums.txt; do
            cosign sign-blob "$file" --yes --bundle "$file.sigstore.json"
          done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Verify signatures
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}"
          for file in dist/mcpd_*.tar.gz dist/install.sh dist/checksums.txt; do
            cosign verify-blob "$file" \
              --bundle "$file.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          extra=""
          case "$VERSION" in
            *-*) extra="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$VERSION" dist/* \
            --verify-tag --generate-notes --title "$VERSION" $extra
