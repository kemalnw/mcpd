[server]
# mcpd is an HTTP origin server. Keep it on an unprivileged backend port and
# put your own HTTPS terminator/reverse proxy in front for remote production use.
listen = "127.0.0.1:31354"
mcp_path = "/mcp"
shutdown_seconds = 10

[process]
default_shell = "/bin/bash"
default_wait_ms = 30000
# Maximum process-output lines returned directly by start_process; remaining
# retained output is available through read_process_output.
initial_output_lines = 200
output_buffer_bytes = 52428800
max_line_bytes = 1048576
completed_sessions = 100
# Hard ceiling for concurrently running jobs inside one process batch.
batch_max_parallel = 4
# Global weighted concurrency across batches. 0 chooses a CPU/memory-aware host default.
batch_global_parallel = 0

[files]
default_read_lines = 1000
max_line_bytes = 1048576
nested_entry_limit = 100
http_timeout_seconds = 15
max_remote_bytes = 16777216

[search]
default_max_results = 1000
retention_seconds = 300
initial_wait_ms = 40

[workflow]
# Durable engineering run/checkpoint state and disk-backed job logs.
# Defaults to the MCPD state directory under "runs".
# state_dir = "/var/lib/mcpd/runs"

[audit]
enabled = true
# path defaults to $XDG_STATE_HOME/mcpd/audit.jsonl or ~/.local/state/mcpd/audit.jsonl

# For a remote production endpoint, enable OAuth and set the canonical public
# HTTPS origin exposed by the user's reverse proxy/TLS terminator.
[auth]
enabled = false
# Example: "https://mcp.example.com" (without /mcp and without trailing slash).
# This remains HTTPS even though mcpd itself listens on plain HTTP locally.
external_url = ""
# state_dir defaults to $XDG_STATE_HOME/mcpd/auth or ~/.local/state/mcpd/auth
access_token_seconds = 3600
# Refresh authorization stays valid while used within this 30-day idle window.
refresh_token_idle_seconds = 2592000
authorization_code_seconds = 300
login_session_seconds = 600
client_metadata_timeout_seconds = 10
