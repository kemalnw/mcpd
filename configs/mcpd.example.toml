[server]
listen = "0.0.0.0:8787"
mcp_path = "/mcp"
shutdown_seconds = 10

[process]
default_shell = "/bin/bash"
default_wait_ms = 30000
output_buffer_bytes = 52428800
max_line_bytes = 1048576
completed_sessions = 100

[files]
default_read_lines = 1000
max_line_bytes = 1048576
nested_entry_limit = 100
http_timeout_seconds = 15
max_remote_bytes = 16777216

[search]
default_max_results = 1000
retention_seconds = 300
initial_wait_ms = 40

[audit]
enabled = true
# path defaults to $XDG_STATE_HOME/mcpd/audit.jsonl or ~/.local/state/mcpd/audit.jsonl

# Local development defaults. For a public endpoint enable OAuth and TLS together.
[auth]
enabled = false
# Canonical HTTPS origin, without /mcp and without a trailing slash.
# A raw public IP is valid, for example: "https://203.0.113.10"
external_url = ""
# state_dir defaults to $XDG_STATE_HOME/mcpd/auth or ~/.local/state/mcpd/auth
access_token_seconds = 3600
authorization_code_seconds = 300
login_session_seconds = 600
client_metadata_timeout_seconds = 10

[tls]
# off | files | acme
mode = "off"
cert_file = ""
key_file = ""

# ACME settings. For Let's Encrypt IP certificates, shortlived is required.
acme_email = ""
acme_server = "https://acme-v02.api.letsencrypt.org/directory"
acme_profile = "shortlived"
# mcpd will not accept CA terms on your behalf; set this explicitly for ACME mode.
acme_accept_tos = false
challenge_listen = ":80"
# cert_dir defaults to $XDG_STATE_HOME/mcpd/tls or ~/.local/state/mcpd/tls
renew_check_seconds = 3600
