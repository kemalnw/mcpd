[server]
listen = "0.0.0.0:8787"
mcp_path = "/mcp"
shutdown_seconds = 10

[process]
default_shell = "/bin/bash"
default_wait_ms = 30000
output_buffer_bytes = 52428800
max_line_bytes = 1048576
completed_sessions = 100

[files]
default_read_lines = 1000
max_line_bytes = 1048576
nested_entry_limit = 100
http_timeout_seconds = 15
max_remote_bytes = 16777216

[audit]
enabled = true
# path defaults to $XDG_STATE_HOME/mcpd/audit.jsonl or ~/.local/state/mcpd/audit.jsonl
